<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Form Placeholder</title>
  </head>

  <body>
    {/* Hidden static form for Netlify build bot discovery */}
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />

      {/* Honeypot field (must match JS form field name) */}
      <input name="bot-field" />

      {/* Inputs matching TSX form name attributes */}
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />

      <select name="service">
        <option value="flake">Epoxy Flake Flooring</option>
        <option value="metallic">Metallic Epoxy</option>
        <option value="custom">Custom Epoxy Build</option>
        <option value="other">Other / Not Sure</option>
      </select>

      <textarea name="message"></textarea>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
